<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest 🎮</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #312e81);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    background: #1f2937;
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 15px 50px #0006;
    text-align: center;
}

h1 {
    color: #a5b4fc;
    font-size: 35px;
    margin-bottom: 5px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 25px;
}

.levels {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: transform .2s, opacity .2s;
}

button:hover {
    transform: translateY(-2px);
    opacity: .9;
}

.level {
    flex: 1;
    color: white;
}

.easy { background: #16a34a; }
.hard { background: #dc2626; }

.stats {
    display: flex;
    justify-content: space-around;
    background: #111827;
    padding: 15px;
    border-radius: 14px;
    margin-bottom: 25px;
    gap: 8px;
}

.stat {
    font-size: 14px;
    color: #cbd5e1;
}

.stat strong {
    display: block;
    font-size: 23px;
    color: white;
    margin-top: 5px;
}

.question-box {
    background: #374151;
    padding: 25px 12px;
    border-radius: 18px;
    margin-bottom: 20px;
}

#question {
    font-size: 32px;
    font-weight: bold;
    color: #facc15;
    overflow-wrap: anywhere;
}

#hint {
    color: #cbd5e1;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid #6366f1;
    background: #111827;
    color: white;
    outline: none;
    margin-bottom: 12px;
}

input:focus {
    border-color: #a5b4fc;
}

.action {
    width: 100%;
    margin-bottom: 10px;
    color: white;
    background: #6366f1;
}

.secondary {
    background: #4b5563;
}

#message {
    min-height: 30px;
    margin: 15px 0;
    font-weight: bold;
    font-size: 16px;
}

#progress {
    color: #cbd5e1;
    font-size: 13px;
}

footer {
    margin-top: 20px;
    color: #9ca3af;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="game">

    <h1>🎮 Math Quest</h1>
    <p class="subtitle">Demuestra que eres un crack de las mates</p>

    <div class="levels">
        <button class="level easy" onclick="setLevel(1)">
            🟢 Fácil · 1.º grado
        </button>
        <button class="level hard" onclick="setLevel(2)">
            🔴 Difícil · 2.º grado
        </button>
    </div>

    <div class="stats">
        <div class="stat">⭐ Puntos<strong id="score">0</strong></div>
        <div class="stat">❤️ Vidas<strong id="lives">3</strong></div>
        <div class="stat">🏆 Récord<strong id="record">0</strong></div>
    </div>

    <p id="levelName">Nivel fácil</p>

    <div class="question-box">
        <p id="question">2x + 5 = 15</p>
        <p id="hint">Encuentra el valor de x</p>
    </div>

    <form id="answerForm">
        <input
            id="answer"
            type="text"
            placeholder="Escribe tu respuesta"
            autocomplete="off"
            required
        >
        <button class="action" type="submit">
            Comprobar respuesta ✓
        </button>
    </form>

    <p id="message" aria-live="polite"></p>

    <button class="action secondary" onclick="newQuestion()">
        🔄 Siguiente ecuación
    </button>

    <button class="action secondary" onclick="restart()">
        🔁 Reiniciar partida
    </button>

    <p id="progress">Resuelve ecuaciones y consigue puntos.</p>

    <footer>Math Quest · Entrena tu cerebro 🧠</footer>
</div>

<script>
let level = 1;
let score = 0;
let lives = 3;
let record = 0;
let solution = [];
let answered = false;
let questionCount = 0;

const $ = id => document.getElementById(id);

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function formatTerm(n, variable = "") {
    if (n === 0 && variable) return "";
    if (variable && Math.abs(n) === 1) {
        return (n < 0 ? "-" : "") + variable;
    }
    return n + variable;
}

function formatPolynomial(b, c) {
    let result = "x²";

    if (b !== 0) {
        result += b > 0 ? " + " : " - ";
        result += Math.abs(b) === 1 ? "" : Math.abs(b);
        result += "x";
    }

    if (c !== 0) {
        result += c > 0 ? " + " : " - ";
        result += Math.abs(c);
    }

    return result + " = 0";
}

function setLevel(n) {
    level = n;
    $("levelName").textContent =
        n === 1 ? "🟢 Nivel fácil" : "🔴 Nivel difícil";
    newQuestion();
}

function newQuestion() {
    if (lives <= 0) return;

    answered = false;
    $("answer").disabled = false;
    $("answer").value = "";
    $("answer").focus();
    $("message").textContent = "";

    if (level === 1) {
        let a = randomInt(1, 10);
        let x = randomInt(-10, 10);
        let b = randomInt(-12, 12);
        let c = a * x + b;

        solution = [x];

        let sign = b >= 0 ? " + " : " - ";
        let equation = formatTerm(a, "x");

        if (b !== 0) {
            equation += sign + Math.abs(b);
        }

        $("question").textContent = equation + " = " + c;
        $("hint").textContent = "Encuentra x. Ejemplo de respuesta: 4";

    } else {
        let r1 = randomInt(-9, 9);
        let r2 = randomInt(-9, 9);

        while (r1 === r2) {
            r2 = randomInt(-9, 9);
        }

        let b = -(r1 + r2);
        let c = r1 * r2;

        solution = [r1, r2].sort((a, b) => a - b);

        $("question").textContent = formatPolynomial(b, c);
        $("hint").textContent =
            "Escribe las dos soluciones separadas por una coma. Ejemplo: -2, 3";
    }

    questionCount++;
    $("progress").textContent =
        "Ecuación número " + questionCount;
}

function updateStats() {
    $("score").textContent = score;
    $("lives").textContent = lives;
    $("record").textContent = record;
}

$("answerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    if (answered || lives <= 0) return;

    const raw = $("answer").value.trim();
    let values;

    if (level === 1) {
        values = [Number(raw)];
    } else {
        values = raw.split(/[,; ]+/).filter(Boolean).map(Number);
    }

    if (
        values.length !== solution.length ||
        values.some(v => !Number.isFinite(v))
    ) {
        $("message").textContent =
            level === 1
            ? "Escribe un número válido 😅"
            : "Escribe las dos soluciones, por ejemplo: -2, 3";
        $("message").style.color = "#fbbf24";
        return;
    }

    answered = true;
    $("answer").disabled = true;

    const correct = values.slice().sort((a, b) => a - b)
        .every((v, i) => Math.abs(v - solution[i]) < 0.000001);

    if (correct) {
        score += level === 1 ? 10 : 25;
        record = Math.max(record, score);
        $("message").textContent =
            "¡CORRECTO! 🎉 + " + (level === 1 ? 10 : 25) + " puntos";
        $("message").style.color = "#4ade80";
    } else {
        lives--;
        $("message").textContent =
            "¡Casi! 😭 La respuesta era: " + solution.join(", ");
        $("message").style.color = "#f87171";
    }

    updateStats();

    if (lives <= 0) {
        $("message").textContent +=
            " | ¡Fin de la partida! Pulsa reiniciar.";
        $("progress").textContent = "Puntuación final: " + score;
    } else {
        $("progress").textContent =
            correct ? "¡Bien hecho! Sigue así 💪" :
            "¡A seguir practicando! No te rindas.";
    }
});

function restart() {
    score = 0;
    lives = 3;
    questionCount = 0;
    updateStats();
    newQuestion();
}

updateStats();
newQuestion();
</script>
</body>
</html>
